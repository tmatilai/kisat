name: elsewhere

# Opens an issue for each championship due a row in elsewhere.json
# (dev/elsewhere-due.mjs).
on:
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  due:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: node dev/elsewhere-due.mjs --open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
