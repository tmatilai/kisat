        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        max-width: 92vw;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--line);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Print comes last, so its light tokens win over the dark scheme's.
         Backgrounds do not print, so text and borders carry the ink. */
      @media print {
        :root {
          --bg: #fff;
          --card: #fff;
          --text: #000;
          --muted: #444;
          --line: #999;
        }
        /* Every .btn is something to tap, and paper offers none of it. */
        .no-print,
        #back,
        #help,
        #updated,
        .days,
        .btn {
          display: none;
        }
        /* The header names the meet and the day, so it prints without its
           controls. */
        header {
          position: static;
          padding: 0 0 10px;
          background: none;
          color: inherit;
        }
        header h1 {
          font-size: 18px;
          white-space: normal;
          overflow: visible;
        }
        .title-text {
          white-space: normal;
          overflow: visible;
        }
        main {
          max-width: none;
          padding: 0;
        }
        a {
          color: inherit;
          text-decoration: none;
        }
        /* Of the filter bar only the kenttä prints, as text. It says which
           board the marks were read off. */
        .filter-bar > :not(.track-pick) {
          display: none;
        }
        .track-pick {
          margin-left: 0;
        }
        .track-pick select {
          appearance: none;
          border: 0;
          background: none;
          padding: 0;
          max-width: none;
        }
        /* A start's phase is news, and paper carried to the track has none. A
           mixed row keeps its category labels and only the chips go. */
        .row .chip {
          display: none;
        }
        .row {
          break-inside: avoid;
        }
        /* A medal is only a disc, so its metal prints as on screen. The ring
           keeps the disc where backgrounds are off. */
        .medal {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          outline: 1px solid var(--line);
          outline-offset: -1px;
        }
        /* The taping figure is sized to the screen column it was drawn in
           (shuttleTapeFigure, app/hurdles.js). It scales to the paper, or the
           edge would cut it off. */
        .shuttle-tapes {
          overflow: visible;
          break-inside: avoid;
        }
        .shuttle-tapes svg {
          width: 100%;
          height: auto;
        }
        /* A ladder too wide for the sheet prints as the stacked cards, as paper
           cannot scroll. ladderViews (app/event.js) picks those starts. */
        .print-stack > .tbl-wrap {
          display: none;
        }
        .print-stack > .ladder-stack {
          display: block;
        }
        .ladder-card {
          break-inside: avoid;
        }
        /* A page break can cut a table in half, so no box is drawn round one.
           The row rules are the table. */
        .tbl,
        .tbl-wrap:has(.tbl.ladder),
        .ladder-stack {
          border: none;
          border-radius: 0;
        }
        /* The chip's tint does not print, so a border keeps it a chip. */
        .chip {
          border: 1px solid var(--line);
        }
        /* The hurdle table prints one table per sheet, headed by the chosen
           classes and the kenttä. A folded section prints nothing. */
        .aidat-page + .aidat-page {
          break-before: page;
        }
        .aidat-all th,
        .aidat-all td {
          padding: 4px 3px;
        }
        .aidat-all .aidat-title th {
          padding-top: 12px;
        }
        .aidat-print {
          display: inline;
          font-weight: 400;
        }
        .aidat-extra:not([open]) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a id="back" href="/" hidden aria-label="Takaisin">‹</a>
      <h1 id="title">Kisat</h1>
      <span id="updated"></span>
      <button id="help" hidden aria-label="Ohje">?</button>
    </header>
    <main id="app"></main>

         of imports at a time. test/source.test.mjs checks the list. -->
    <link rel="modulepreload" href="/app/data.js" />

    <link rel="modulepreload" href="/lib/ages.js" />
    <link rel="modulepreload" href="/lib/combined.js" />
    <link rel="modulepreload" href="/lib/dates.js" />
    <link rel="modulepreload" href="/lib/digest.js" />
    <link rel="modulepreload" href="/lib/districts.js" />
    <link rel="modulepreload" href="/lib/elsewhere.js" />
    <link rel="modulepreload" href="/lib/home.js" />
    <link rel="modulepreload" href="/lib/indexes.js" />
    <link rel="modulepreload" href="/lib/render-log.js" />
    <link rel="modulepreload" href="/lib/results.js" />
    <link rel="modulepreload" href="/lib/routes.js" />

    <link rel="modulepreload" href="/lib/watch.js" />
    <script type="module" src="/app.js"></script>
  </body>
